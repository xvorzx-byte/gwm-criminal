<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>สูตรอาหาร · GWM GuildOS</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<style>
/* ── Base + CSS vars ─────────────────────────────────────────── */
:root {
  --bg-0:        oklch(0.13 0.005 250);
  --bg-1:        oklch(0.165 0.006 250);
  --bg-2:        oklch(0.20 0.006 250);
  --bg-3:        oklch(0.245 0.006 250);
  --line:        oklch(0.30 0.008 250 / 0.6);
  --line-strong: oklch(0.40 0.010 250 / 0.85);
  --fg-0:        oklch(0.96 0.004 250);
  --fg-1:        oklch(0.80 0.004 250);
  --fg-2:        oklch(0.60 0.005 250);
  --fg-3:        oklch(0.45 0.006 250);
  --accent:      oklch(0.78 0.10 75);
  --accent-soft: oklch(0.78 0.10 75 / 0.10);
  --accent-line: oklch(0.78 0.10 75 / 0.35);
  --tier-1:      oklch(0.72 0.10 145);
  --tier-2:      oklch(0.74 0.11 220);
  --tier-3:      oklch(0.78 0.13 320);
  --ok:          oklch(0.75 0.13 155);
  --err:         oklch(0.70 0.18 22);
  --warn:        oklch(0.80 0.14 70);
  --r: 6px; --r-sm: 4px; --r-lg: 8px;
  --mono: "JetBrains Mono", ui-monospace, monospace;
  --sans: "Geist", "Noto Sans Thai", system-ui, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg-0); color: var(--fg-0);
  font-family: var(--sans); font-size: 13px; line-height: 1.5;
  letter-spacing: -0.003em; min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
input, button, select, textarea { font-family: inherit; color: inherit; }
button, select { cursor: pointer; }
::selection { background: var(--accent-soft); }

/* category colors */
.cat-fish   { --cat-c: oklch(0.74 0.11 220); }
.cat-grain  { --cat-c: oklch(0.78 0.10 75);  }
.cat-meat   { --cat-c: oklch(0.68 0.14 25);  }
.cat-veg    { --cat-c: oklch(0.72 0.12 145); }
.cat-flower { --cat-c: oklch(0.78 0.13 320); }
.cat-spice  { --cat-c: oklch(0.74 0.06 80);  }

.tier-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 1px 7px; border-radius: 3px;
  border: 1px solid var(--tier-c, var(--line));
  color: var(--tier-c, var(--fg-2));
  background: oklch(0.20 0.006 250 / 0.4);
}
.tier-pill.t-1  { --tier-c: var(--tier-1); }
.tier-pill.t-6  { --tier-c: var(--tier-2); }
.tier-pill.t-11 { --tier-c: var(--tier-3); }

.method-pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 10.5px; color: var(--m-color, var(--fg-2)); font-weight: 500;
}
.method-pill .m-glyph { width: 18px; height: 18px; color: var(--m-color); }

.ing-dot {
  width: 7px; height: 7px; border-radius: 2px;
  background: var(--cat-c, var(--fg-3)); flex-shrink: 0;
}

.back {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 10px; background: transparent;
  border: 1px solid var(--line); border-radius: var(--r);
  color: var(--fg-2); font-size: 11.5px; text-decoration: none;
  transition: color .12s, border-color .12s;
}
.back:hover { color: var(--fg-0); border-color: var(--line-strong); }

/* ── App v2 layout ───────────────────────────────────────────── */
.app-v2 {
  max-width: 1480px; margin: 0 auto;
  padding: 20px 22px 80px;
  min-height: 100vh; display: flex; flex-direction: column;
}
.app-v2 .head {
  display: flex; align-items: center; gap: 12px;
  padding-bottom: 14px; margin-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.h-title { flex: 1; min-width: 0; }
.h-title h1 {
  margin: 0; font-size: 15px; font-weight: 600;
  letter-spacing: -0.005em; color: var(--fg-0);
  display: flex; align-items: center; gap: 8px;
}
.h-title h1 .glyph { width: 20px; height: 20px; color: var(--accent); flex-shrink: 0; }
.h-title .sub { display: block; font-size: 11.5px; color: var(--fg-3); font-family: var(--mono); margin-top: 3px; }

.layout {
  flex: 1; display: grid;
  grid-template-columns: 340px 1fr;
  gap: 16px; min-height: 0;
}

/* Rail */
.rail {
  background: var(--bg-1); border: 1px solid var(--line);
  border-radius: var(--r-lg); display: flex; flex-direction: column;
  overflow: hidden; position: sticky; top: 20px;
  align-self: start; max-height: calc(100vh - 40px);
}
.rail-filters {
  padding: 11px; display: flex; flex-direction: column; gap: 8px;
  border-bottom: 1px solid var(--line);
  background: oklch(0.155 0.006 250);
}
.rail-filters .search {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-0); border: 1px solid var(--line);
  border-radius: var(--r); padding: 6px 11px;
}
.rail-filters .search:focus-within { border-color: var(--line-strong); }
.rail-filters .search .ic { color: var(--fg-3); }
.rail-filters .search input {
  flex: 1; background: transparent; border: none;
  color: var(--fg-0); font-size: 12.5px; outline: none; padding: 2px 0;
}
.rail-filters .search input::placeholder { color: var(--fg-3); }
.rail-filters .seg {
  display: flex; background: var(--bg-0);
  border: 1px solid var(--line); border-radius: var(--r); padding: 2px;
}
.rail-filters .seg button {
  flex: 1; padding: 4px 8px; background: transparent; border: none;
  color: var(--fg-3); font-size: 11px; font-weight: 500;
  border-radius: 4px; transition: color .12s, background .12s;
}
.rail-filters .seg button:hover { color: var(--fg-1); }
.rail-filters .seg button.on { background: var(--bg-3); color: var(--fg-0); }
.rail-methods { display: flex; gap: 4px; }
.m-chip.mini {
  width: 100%; padding: 5px; background: var(--bg-0);
  border: 1px solid var(--line); border-radius: var(--r-sm);
  color: var(--fg-3); display: grid; place-items: center; transition: .12s;
}
.m-chip.mini:hover { color: var(--fg-0); border-color: var(--line-strong); }
.m-chip.mini.on {
  color: var(--m-color, var(--accent));
  border-color: var(--m-color, var(--accent-line));
  background: oklch(from var(--m-color, var(--accent)) l c h / 0.12);
}
.m-chip.mini svg { width: 13px; height: 13px; }
.rail-count {
  padding: 8px 14px; font-size: 10px; font-family: var(--mono);
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3);
  border-bottom: 1px solid var(--line); background: oklch(0.15 0.006 250);
}
.rail-count b { color: var(--fg-0); font-weight: 600; }
.rail-list { overflow-y: auto; flex: 1; min-height: 0; scrollbar-width: thin; }
.rail-list::-webkit-scrollbar { width: 6px; }
.rail-list::-webkit-scrollbar-thumb { background: oklch(0.30 0.008 250 / 0.5); border-radius: 3px; }
.rail-group { display: flex; flex-direction: column; }
.rail-group-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 14px 4px; position: sticky; top: 0; z-index: 2;
  background: linear-gradient(to bottom, var(--bg-1) 75%, transparent);
}
.rail-group-count { font-family: var(--mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; }
.lr-row {
  display: grid; grid-template-columns: 28px 1fr auto;
  align-items: center; gap: 9px; padding: 9px 12px;
  background: transparent; border: none;
  border-left: 2px solid transparent;
  text-align: left; cursor: pointer;
  transition: background .12s, border-color .12s;
  position: relative; width: 100%;
}
.lr-row::after {
  content: ''; position: absolute; left: 14px; right: 14px; bottom: 0;
  height: 1px; background: oklch(0.22 0.006 250 / 0.5);
}
.lr-row:last-child::after { display: none; }
.lr-row:hover { background: var(--bg-2); }
.lr-row.is-active { background: var(--bg-2); border-left-color: var(--m-color, var(--accent)); }
.lr-row.is-active .lr-name { color: var(--fg-0); }
.lr-num { font-family: var(--mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; text-align: right; }
.lr-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.lr-name { font-size: 12.5px; font-weight: 500; color: var(--fg-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
.lr-meta { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.lr-meta .tier-pill { font-size: 9px; padding: 0 5px; line-height: 1.4; }
.lr-method { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--m-color, var(--fg-3)); }
.lr-method svg { width: 9px; height: 9px; }
.lr-batch { font-family: var(--mono); font-size: 9.5px; color: var(--accent); padding: 0 4px; border: 1px solid var(--accent-line); border-radius: 3px; background: var(--accent-soft); }
.lr-tail { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }
.lr-qty { font-family: var(--mono); font-size: 10.5px; color: var(--accent); background: var(--accent-soft); padding: 1px 6px; border-radius: 3px; border: 1px solid var(--accent-line); font-weight: 600; }
.lr-chev { color: var(--fg-3); display: grid; place-items: center; width: 12px; height: 12px; opacity: 0; transition: opacity .12s; }
.lr-chev svg { width: 12px; height: 12px; }
.lr-row:hover .lr-chev, .lr-row.is-active .lr-chev { opacity: 1; }
.lr-row.is-active .lr-chev { color: var(--fg-1); }

/* Pane / Detail */
.pane { background: var(--bg-1); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; min-width: 0; }
.detail { padding: 20px 24px 24px; display: flex; flex-direction: column; gap: 18px; overflow-y: auto; max-height: calc(100vh - 40px); }
.empty-detail { align-items: center; justify-content: center; text-align: center; min-height: 360px; color: var(--fg-3); gap: 12px; }
.ed-mark { width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; color: var(--accent); background: var(--accent-soft); }
.ed-mark svg { width: 24px; height: 24px; }
.ed-title { font-size: 14px; color: var(--fg-1); font-weight: 600; }
.ed-sub { font-size: 11.5px; color: var(--fg-3); font-family: var(--mono); }
.dt-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
.dt-head-left { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.dt-id { font-family: var(--mono); font-size: 10px; color: var(--fg-3); letter-spacing: 0.2em; text-transform: uppercase; }
.dt-title { margin: 0; font-size: 22px; font-weight: 600; color: var(--fg-0); letter-spacing: -0.01em; line-height: 1.2; }
.dt-meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 2px; }
.dt-meta .method-pill { font-size: 12px; font-weight: 500; }
.dt-meta .method-pill svg { width: 13px; height: 13px; }
.dt-meta .tier-pill { font-size: 10.5px; padding: 2px 8px; }
.dt-batch-badge { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--accent); padding: 2px 7px; border: 1px solid var(--accent-line); border-radius: 4px; background: var(--accent-soft); }
.dt-actions { flex-shrink: 0; }
.dt-add { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; }
.dt-add-lbl { font-size: 9.5px; font-family: var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); }
.bk-qty.big { background: var(--bg-2); border: 1px solid var(--line-strong); border-radius: var(--r); display: inline-flex; }
.bk-qty.big button { width: 32px; height: 32px; background: transparent; border: none; color: var(--fg-1); display: grid; place-items: center; transition: .12s; }
.bk-qty.big button:hover { background: var(--bg-3); color: var(--fg-0); }
.bk-qty.big button:disabled { opacity: 0.35; cursor: not-allowed; }
.bk-qty.big button svg { width: 12px; height: 12px; }
.bk-qty.big input { width: 44px; text-align: center; background: transparent; border: none; border-left: 1px solid var(--line); border-right: 1px solid var(--line); color: var(--fg-0); font-family: var(--mono); font-size: 15px; font-weight: 600; outline: none; height: 32px; -moz-appearance: textfield; }
.bk-qty.big input::-webkit-outer-spin-button, .bk-qty.big input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.dt-stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dt-stat { background: var(--bg-1); padding: 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.dt-stat-lbl { font-size: 9.5px; font-family: var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); }
.dt-stat-val { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--fg-0); letter-spacing: -0.01em; line-height: 1.05; display: flex; align-items: baseline; gap: 5px; }
.dt-stat-val .unit { font-size: 10px; color: var(--fg-3); font-weight: 400; letter-spacing: 0.04em; }
.dt-stat-sub { font-size: 10.5px; font-family: var(--mono); color: var(--fg-3); letter-spacing: 0.02em; }
.dt-section { display: flex; flex-direction: column; gap: 10px; }
.dt-section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.dt-section-title { font-size: 12px; font-weight: 600; color: var(--fg-1); letter-spacing: 0.04em; text-transform: uppercase; }
.dt-section-sub { font-size: 10.5px; font-family: var(--mono); color: var(--fg-3); letter-spacing: 0.04em; }
.dt-ing-table { background: var(--bg-0); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dt-ing-row { display: grid; grid-template-columns: 44px 1.4fr 80px 1fr 60px; align-items: center; gap: 12px; padding: 8px 14px; border-bottom: 1px solid oklch(0.22 0.006 250 / 0.5); }
.dt-ing-row:last-child { border-bottom: none; }
.dt-ing-dot { display: grid; place-items: center; width: 44px; height: 44px; }
.dt-ing-dot .ing-dot { width: 8px; height: 8px; }
.dt-ing-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.dt-ing-name .n { font-size: 13px; font-weight: 500; color: var(--fg-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dt-ing-name .c { font-size: 10px; font-family: var(--mono); color: var(--fg-3); letter-spacing: 0.04em; }
.dt-ing-qty { font-family: var(--mono); display: flex; align-items: baseline; gap: 3px; }
.dt-ing-qty b { color: var(--fg-0); font-weight: 600; font-size: 16px; }
.dt-ing-qty span { font-size: 10px; color: var(--fg-3); letter-spacing: 0.04em; }
.dt-ing-src { font-size: 11px; color: var(--fg-2); font-family: var(--mono); letter-spacing: 0.02em; }
.dt-ing-cost { font-family: var(--mono); font-size: 12px; color: var(--fg-1); text-align: right; font-weight: 500; }
.dt-cost-strip { display: flex; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.dt-cost-cell { flex: 1; background: var(--bg-2); padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; }
.dt-cost-cell .lbl { font-size: 9.5px; font-family: var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-3); }
.dt-cost-cell .val { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--fg-0); }
.dt-cost-cell .sub { font-size: 10px; font-family: var(--mono); color: var(--fg-3); }
.dt-cost-cell.accent .val { color: var(--accent); }
.dt-related { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px,1fr)); gap: 8px; }
.rel-card { display: grid; grid-template-columns: 24px 1fr auto; align-items: center; gap: 8px; background: var(--bg-2); border: 1px solid var(--line); border-left: 2px solid var(--m-color, var(--accent)); border-radius: var(--r-sm); padding: 8px 11px; cursor: pointer; text-align: left; transition: background .12s, border-color .12s; }
.rel-card:hover { background: var(--bg-3); border-left-color: var(--m-color, var(--accent)); }
.rel-num { font-family: var(--mono); font-size: 10px; color: var(--fg-3); }
.rel-name { font-size: 12px; font-weight: 500; color: var(--fg-0); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rel-cost { font-family: var(--mono); font-size: 11px; color: var(--fg-2); }
.rel-meta { display: inline-flex; align-items: center; gap: 5px; color: var(--m-color, var(--fg-3)); }
.rel-meta svg { width: 11px; height: 11px; }
.rel-meta .tier-pill { font-size: 9px; padding: 0 5px; }

/* Basket bar */
.bkbar { position: sticky; bottom: 0; left: 0; right: 0; margin: 16px -22px -80px; padding: 0 22px 16px; background: linear-gradient(to top, var(--bg-0) 70%, transparent); z-index: 50; pointer-events: none; }
.bkbar-handle { display: flex; align-items: center; gap: 14px; background: var(--bg-1); border: 1px solid var(--line-strong); border-radius: var(--r-lg); padding: 11px 16px; cursor: pointer; color: var(--fg-1); font-family: inherit; width: 100%; pointer-events: auto; transition: border-color .12s, background .12s; }
.bkbar-handle:hover { background: var(--bg-2); border-color: var(--accent-line); }
.bkbar-icon { display: inline-block; color: var(--fg-3); font-size: 10px; transition: transform .2s; }
.bkbar.is-open .bkbar-icon { transform: rotate(180deg); color: var(--accent); }
.bkbar-label { font-size: 12px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--fg-0); }
.bkbar-pill { font-family: var(--mono); font-size: 10.5px; font-weight: 600; background: var(--accent-soft); color: var(--accent); border: 1px solid var(--accent-line); border-radius: 99px; padding: 1px 8px; }
.bkbar-stat { font-family: var(--mono); font-size: 11.5px; color: var(--fg-2); }
.bkbar-stat b { color: var(--fg-0); font-weight: 600; font-size: 13px; margin-right: 3px; }
.bkbar-spacer { flex: 1; }
.bkbar-toggle { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }
.bkbar-body { background: var(--bg-1); border: 1px solid var(--line-strong); border-top: none; border-radius: 0 0 var(--r-lg) var(--r-lg); margin-top: -8px; padding-top: 12px; pointer-events: auto; max-height: 50vh; overflow-y: auto; }
.bkbar-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1px; background: var(--line); }
.bkbar-col { background: var(--bg-1); display: flex; flex-direction: column; min-height: 100px; }
.bkbar-col-head { padding: 8px 14px; display: flex; align-items: baseline; justify-content: space-between; background: oklch(0.155 0.006 250); border-bottom: 1px solid var(--line); }
.bkbar-col-title { font-size: 10px; font-family: var(--mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-1); font-weight: 600; }
.bkbar-col-sub { font-size: 10px; font-family: var(--mono); color: var(--fg-3); }
.bkbar-clear { font-size: 10px; font-family: var(--mono); color: var(--fg-3); background: transparent; border: 1px solid var(--line); padding: 2px 8px; border-radius: 3px; }
.bkbar-clear:hover { color: var(--fg-0); border-color: var(--line-strong); }
.bkbar-recipes, .bkbar-totals { padding: 6px 0; }
.bkbar-recipe { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 6px 14px; }
.bkbar-recipe-name { background: transparent; border: none; color: var(--fg-0); font-size: 12px; text-align: left; cursor: pointer; padding: 0; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.bkbar-recipe-name:hover { color: var(--accent); }
.bkbar-recipe-name .lvl { font-family: var(--mono); font-size: 9.5px; color: var(--fg-3); letter-spacing: 0.04em; flex-shrink: 0; }
.bkbar-recipe .bk-qty { display: inline-flex; align-items: center; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--r-sm); }
.bkbar-recipe .bk-qty button { width: 22px; height: 22px; background: transparent; border: none; color: var(--fg-2); font-size: 13px; font-family: var(--mono); }
.bkbar-recipe .bk-qty button:hover { background: var(--bg-3); color: var(--fg-0); }
.bkbar-recipe .bk-qty input { width: 30px; text-align: center; background: transparent; border: none; color: var(--fg-0); font-family: var(--mono); font-size: 11.5px; outline: none; -moz-appearance: textfield; }
.bkbar-recipe .bk-qty input::-webkit-outer-spin-button, .bkbar-recipe .bk-qty input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.bkbar-totals .bk-tot-row { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: baseline; padding: 5px 14px; }
.bkbar-totals .bk-tot-row .name { font-size: 11.5px; color: var(--fg-1); display: flex; align-items: center; gap: 6px; min-width: 0; }
.bkbar-totals .bk-tot-row .name .ing-dot { width: 6px; height: 6px; }
.bkbar-totals .bk-tot-row .name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bkbar-totals .bk-tot-row .qty { font-family: var(--mono); font-size: 11px; color: var(--fg-0); font-weight: 600; }
.bkbar-totals .bk-tot-row .sub { font-family: var(--mono); font-size: 10px; color: var(--fg-3); }
.bkbar-empty { padding: 20px 14px; text-align: center; font-size: 11px; color: var(--fg-3); font-family: var(--mono); }
.empty { padding: 40px 20px; text-align: center; color: var(--fg-3); font-size: 12px; }

/* ── Admin Panel ─────────────────────────────────────────────── */
.admin-bar {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 12px; background: oklch(0.62 0.14 60 / 0.08);
  border: 1px solid oklch(0.62 0.14 60 / 0.25); border-radius: var(--r);
  margin-bottom: 14px;
}
.admin-bar-label {
  font-size: 10px; font-family: var(--mono); letter-spacing: 0.18em;
  text-transform: uppercase; color: oklch(0.78 0.10 75); font-weight: 600;
}
.admin-bar-spacer { flex: 1; }
.admin-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; background: var(--bg-2);
  border: 1px solid var(--line-strong); border-radius: var(--r-sm);
  color: var(--fg-1); font-size: 11.5px; font-weight: 500;
  transition: .12s;
}
.admin-btn:hover { background: var(--bg-3); color: var(--fg-0); }
.admin-btn.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
.admin-btn.accent:hover { background: oklch(0.78 0.10 75 / 0.20); }
.admin-btn.danger { background: oklch(0.70 0.18 22 / 0.10); border-color: oklch(0.70 0.18 22 / 0.35); color: oklch(0.70 0.18 22); }
.admin-btn.danger:hover { background: oklch(0.70 0.18 22 / 0.18); }
.admin-btn svg { width: 13px; height: 13px; }

/* Modal overlay */
.modal-overlay {
  position: fixed; inset: 0; z-index: 200;
  background: oklch(0.05 0.005 250 / 0.80);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
}
.modal {
  background: var(--bg-1); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); width: 100%; max-width: 620px;
  max-height: 90vh; overflow-y: auto; display: flex; flex-direction: column;
}
.modal-head {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--bg-1); z-index: 1;
}
.modal-title { flex: 1; font-size: 14px; font-weight: 600; color: var(--fg-0); }
.modal-close {
  width: 28px; height: 28px; background: transparent; border: 1px solid var(--line);
  border-radius: var(--r-sm); color: var(--fg-2); display: grid; place-items: center;
}
.modal-close:hover { color: var(--fg-0); border-color: var(--line-strong); }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer {
  padding: 14px 20px; border-top: 1px solid var(--line);
  display: flex; align-items: center; justify-content: flex-end; gap: 8px;
  position: sticky; bottom: 0; background: var(--bg-1);
}

/* Form elements */
.form-row { display: flex; flex-direction: column; gap: 5px; }
.form-row-inline { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-label { font-size: 11px; font-weight: 500; color: var(--fg-2); font-family: var(--mono); letter-spacing: 0.04em; text-transform: uppercase; }
.form-input {
  background: var(--bg-0); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 8px 11px;
  color: var(--fg-0); font-size: 13px; outline: none;
  transition: border-color .12s;
}
.form-input:focus { border-color: var(--accent-line); }
.form-select {
  background: var(--bg-0); border: 1px solid var(--line);
  border-radius: var(--r-sm); padding: 8px 11px;
  color: var(--fg-0); font-size: 13px; outline: none;
  width: 100%; appearance: none;
}
.form-select:focus { border-color: var(--accent-line); }

/* Ingredient rows in recipe form */
.ing-form-list { display: flex; flex-direction: column; gap: 6px; }
.ing-form-row {
  display: grid; grid-template-columns: 1fr 80px auto;
  gap: 6px; align-items: center;
}
.ing-rm-btn {
  width: 28px; height: 28px; background: transparent;
  border: 1px solid oklch(0.70 0.18 22 / 0.30); border-radius: var(--r-sm);
  color: oklch(0.70 0.18 22 / 0.7); display: grid; place-items: center;
}
.ing-rm-btn:hover { color: var(--err); border-color: var(--err); }
.add-ing-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 11px; background: transparent;
  border: 1px dashed var(--line-strong); border-radius: var(--r-sm);
  color: var(--fg-3); font-size: 11.5px; width: 100%;
  justify-content: center; margin-top: 4px;
}
.add-ing-btn:hover { color: var(--fg-1); border-color: var(--fg-2); }

/* Admin tabs */
.admin-tabs { display: flex; gap: 2px; background: var(--bg-0); border: 1px solid var(--line); border-radius: var(--r); padding: 2px; margin-bottom: 12px; }
.admin-tab { flex: 1; padding: 6px 12px; background: transparent; border: none; color: var(--fg-3); font-size: 12px; font-weight: 500; border-radius: 4px; transition: .12s; }
.admin-tab:hover { color: var(--fg-1); }
.admin-tab.on { background: var(--bg-3); color: var(--fg-0); }

/* Admin table */
.admin-table { background: var(--bg-0); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.admin-table-head { display: flex; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); background: oklch(0.155 0.006 250); gap: 8px; }
.admin-table-head-label { font-size: 10px; font-family: var(--mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg-3); }
.admin-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border-bottom: 1px solid oklch(0.22 0.006 250 / 0.5); }
.admin-row:last-child { border-bottom: none; }
.admin-row:hover { background: var(--bg-2); }
.admin-row-name { flex: 1; font-size: 12.5px; color: var(--fg-0); font-weight: 500; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.admin-row-meta { font-size: 11px; font-family: var(--mono); color: var(--fg-3); flex-shrink: 0; }
.admin-row-acts { display: flex; gap: 4px; flex-shrink: 0; }
.tbl-btn { width: 26px; height: 26px; background: transparent; border: 1px solid var(--line); border-radius: var(--r-sm); color: var(--fg-3); display: grid; place-items: center; }
.tbl-btn:hover { color: var(--fg-0); border-color: var(--line-strong); background: var(--bg-3); }
.tbl-btn.danger { border-color: oklch(0.70 0.18 22 / 0.30); color: oklch(0.70 0.18 22 / 0.6); }
.tbl-btn.danger:hover { color: var(--err); border-color: var(--err); background: oklch(0.70 0.18 22 / 0.08); }
.tbl-btn svg { width: 12px; height: 12px; }

/* Toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--bg-3); border: 1px solid var(--line-strong);
  border-radius: var(--r-lg); padding: 10px 18px;
  font-size: 12.5px; color: var(--fg-0); z-index: 999;
  display: flex; align-items: center; gap: 8px;
  animation: toastIn .2s ease;
}
.toast.ok { border-color: oklch(0.75 0.13 155 / 0.5); color: var(--ok); }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

/* Loading / Error state */
.state-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 12px; color: var(--fg-3); }
.state-screen svg { width: 32px; height: 32px; opacity: .4; }
.state-screen p { font-size: 13px; margin: 0; }

@media (max-width: 1100px) { .layout { grid-template-columns: 300px 1fr; } .dt-stats { grid-template-columns: repeat(2,1fr); } .bkbar-grid { grid-template-columns: 1fr; } }
@media (max-width: 820px) { .layout { grid-template-columns: 1fr; } .rail { position: static; max-height: 360px; } .detail { max-height: none; } .dt-head { flex-direction: column; } .bkbar { margin: 12px -12px -40px; padding: 0 12px 12px; } .form-row-inline { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── SVG Icons ───────────────────────────────────────────────── */
const Ic = {
  chef: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 2a4 4 0 0 1 4 4c0 .34-.04.67-.1 1A5 5 0 0 1 20 12v1H4v-1a5 5 0 0 1 4.1-4.93A4 4 0 0 1 12 2z"/><rect x="4" y="14" width="16" height="7" rx="1"/></svg>,
  search: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.35-4.35"/></svg>,
  chevR: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m9 18 6-6-6-6"/></svg>,
  plus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
  minus: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14"/></svg>,
  chevD: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m6 9 6 6 6-6"/></svg>,
  fire: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 2c0 5-4 7-4 12a4 4 0 0 0 8 0c0-5-4-7-4-12z"/><path d="M12 12c0 2-1.5 3.5-1.5 5.5a1.5 1.5 0 0 0 3 0c0-2-1.5-3.5-1.5-5.5z"/></svg>,
  wind: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>,
  ice: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><line x1="12" y1="2" x2="12" y2="22"/><path d="m20 7-8 5-8-5"/><path d="m20 17-8-5-8 5"/></svg>,
  steam: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M8 2c0 4-4 4-4 8"/><path d="M12 2c0 4-4 4-4 8"/><path d="M16 2c0 4-4 4-4 8"/><path d="M4 18h16"/><path d="M4 22h16"/></svg>,
  lightning: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/></svg>,
  stone: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M3 12c0-4.97 4.03-9 9-9s9 4.03 9 9"/><path d="M3 12c0 4.97 4.03 9 9 9s9-4.03 9-9"/><path d="M12 3v18"/><path d="M3 12h18"/></svg>,
  basket: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>,
  edit: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,
  trash: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>,
  download: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
  x: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>,
  check: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 18 4 13"/></svg>,
  shield: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  refresh: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>,
};

/* ── Method config ───────────────────────────────────────────── */
const METHOD_CFG = {
  "ผัด":     { icon: Ic.fire,      hue: 25,  color: "oklch(0.72 0.13 25)"  },
  "ตากลม":   { icon: Ic.wind,      hue: 200, color: "oklch(0.72 0.10 200)" },
  "แช่แข็ง": { icon: Ic.ice,       hue: 240, color: "oklch(0.72 0.08 240)" },
  "นึ่ง":    { icon: Ic.steam,     hue: 165, color: "oklch(0.72 0.10 165)" },
  "การทอด":  { icon: Ic.lightning, hue: 75,  color: "oklch(0.78 0.13 75)"  },
  "การอบ":   { icon: Ic.stone,     hue: 45,  color: "oklch(0.74 0.10 45)"  },
};

const CAT_MAP = {
  "ปลา":          { key: "fish",   color: "oklch(0.74 0.11 220)" },
  "ธัญพืช":       { key: "grain",  color: "oklch(0.78 0.10 75)"  },
  "เนื้อสัตว์":   { key: "meat",   color: "oklch(0.68 0.14 25)"  },
  "ผัก":          { key: "veg",    color: "oklch(0.72 0.12 145)" },
  "ดอกไม้":       { key: "flower", color: "oklch(0.78 0.13 320)" },
  "เครื่องปรุง":  { key: "spice",  color: "oklch(0.74 0.06 80)"  },
};

/* ── Tier label helper ───────────────────────────────────────── */
function tierLabel(lvl) {
  if (lvl >= 11) return { cls: "t-11", label: "Lv.11+" };
  if (lvl >= 6)  return { cls: "t-6",  label: "Lv.6+"  };
  return { cls: "t-1", label: "Lv.1+" };
}

/* ── Toast ───────────────────────────────────────────────────── */
function Toast({ msg, ok, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2200); return () => clearTimeout(t); }, []);
  return <div className={`toast${ok?" ok":""}`}>{ok ? Ic.check : null}{msg}</div>;
}

/* ══════════════════════════════════════════════════════════════ */
/*  ADMIN MODAL — Recipe Form                                     */
/* ══════════════════════════════════════════════════════════════ */
function RecipeModal({ initial, ingredients, methods, onSave, onClose }) {
  const allIds = Object.keys(ingredients).map(Number);
  const [name, setName]     = useState(initial?.name       ?? "");
  const [lvl, setLvl]       = useState(initial?.station_level ?? 1);
  const [method, setMethod] = useState(initial?.method     ?? Object.keys(methods)[0]);
  const [batch, setBatch]   = useState(initial?.batch      ?? 1);
  const [ings, setIngs]     = useState(
    initial?.ingredients
      ? initial.ingredients.map(i => ({ id: i.id, qty: i.qty }))
      : [{ id: allIds[0], qty: 1 }]
  );

  const addIng  = () => setIngs(p => [...p, { id: allIds[0], qty: 1 }]);
  const rmIng   = i => setIngs(p => p.filter((_,j) => j !== i));
  const setId   = (i,v)=> setIngs(p => p.map((x,j) => j===i ? {...x, id: Number(v)} : x));
  const setQty  = (i,v)=> setIngs(p => p.map((x,j) => j===i ? {...x, qty: Math.max(1, Number(v)||1)} : x));

  const handleSave = () => {
    if (!name.trim()) return;
    onSave({ name: name.trim(), station_level: Number(lvl), method, batch: Number(batch), ingredients: ings });
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-head">
          <span className="modal-title">{initial ? "แก้ไขสูตรอาหาร" : "เพิ่มสูตรอาหาร"}</span>
          <button className="modal-close" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <label className="form-label">ชื่อสูตร</label>
            <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="ชื่ออาหาร..." />
          </div>
          <div className="form-row-inline">
            <div className="form-row">
              <label className="form-label">ระดับครัว</label>
              <select className="form-select form-input" value={lvl} onChange={e=>setLvl(e.target.value)}>
                <option value={1}>Lv.1+</option>
                <option value={6}>Lv.6+</option>
                <option value={11}>Lv.11+</option>
              </select>
            </div>
            <div className="form-row">
              <label className="form-label">วิธีทำ</label>
              <select className="form-select form-input" value={method} onChange={e=>setMethod(e.target.value)}>
                {Object.keys(methods).map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
          </div>
          <div className="form-row" style={{maxWidth:160}}>
            <label className="form-label">Batch (ผลผลิต)</label>
            <input className="form-input" type="number" min={1} value={batch} onChange={e=>setBatch(e.target.value)} />
          </div>
          <div className="form-row">
            <label className="form-label">วัตถุดิบ</label>
            <div className="ing-form-list">
              {ings.map((row, i) => (
                <div className="ing-form-row" key={i}>
                  <select className="form-select form-input" value={row.id} onChange={e=>setId(i,e.target.value)}>
                    {allIds.map(id => <option key={id} value={id}>{ingredients[id]?.name ?? `#${id}`}</option>)}
                  </select>
                  <input className="form-input" type="number" min={1} value={row.qty} onChange={e=>setQty(i,e.target.value)} style={{textAlign:'center'}} />
                  <button className="ing-rm-btn" onClick={()=>rmIng(i)} disabled={ings.length<=1}>{Ic.trash}</button>
                </div>
              ))}
              <button className="add-ing-btn" onClick={addIng}>{Ic.plus} เพิ่มวัตถุดิบ</button>
            </div>
          </div>
        </div>
        <div className="modal-footer">
          <button className="admin-btn" onClick={onClose}>ยกเลิก</button>
          <button className="admin-btn accent" onClick={handleSave}>{Ic.check} บันทึก</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════ */
/*  ADMIN MODAL — Ingredient Form                                 */
/* ══════════════════════════════════════════════════════════════ */
function IngModal({ initial, onSave, onClose }) {
  const [name, setName]     = useState(initial?.name     ?? "");
  const [cat,  setCat]      = useState(initial?.category ?? "ธัญพืช");
  const [price, setPrice]   = useState(initial?.price    ?? 38);
  const [limit, setLimit]   = useState(initial?.limit    ?? 300);
  const [sources, setSources] = useState((initial?.source ?? ["ร้านค้า"]).join(", "));

  const handleSave = () => {
    if (!name.trim()) return;
    onSave({
      name: name.trim(),
      category: cat,
      price: Number(price),
      limit: Number(limit),
      source: sources.split(",").map(s => s.trim()).filter(Boolean),
    });
  };

  return (
    <div className="modal-overlay" onClick={e => e.target===e.currentTarget && onClose()}>
      <div className="modal">
        <div className="modal-head">
          <span className="modal-title">{initial ? "แก้ไขวัตถุดิบ" : "เพิ่มวัตถุดิบ"}</span>
          <button className="modal-close" onClick={onClose}>{Ic.x}</button>
        </div>
        <div className="modal-body">
          <div className="form-row">
            <label className="form-label">ชื่อวัตถุดิบ</label>
            <input className="form-input" value={name} onChange={e=>setName(e.target.value)} placeholder="ชื่อวัตถุดิบ..." />
          </div>
          <div className="form-row-inline">
            <div className="form-row">
              <label className="form-label">หมวดหมู่</label>
              <select className="form-select form-input" value={cat} onChange={e=>setCat(e.target.value)}>
                {Object.keys(CAT_MAP).map(c => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
            <div className="form-row">
              <label className="form-label">ราคา / ชิ้น</label>
              <input className="form-input" type="number" min={0} value={price} onChange={e=>setPrice(e.target.value)} />
            </div>
          </div>
          <div className="form-row-inline">
            <div className="form-row">
              <label className="form-label">Limit (0 = ไม่จำกัด)</label>
              <input className="form-input" type="number" min={0} value={limit} onChange={e=>setLimit(e.target.value)} />
            </div>
            <div className="form-row">
              <label className="form-label">แหล่งที่มา (คั่นด้วย ,)</label>
              <input className="form-input" value={sources} onChange={e=>setSources(e.target.value)} placeholder="ร้านค้า, ตกปลา" />
            </div>
          </div>
        </div>
        <div className="modal-footer">
          <button className="admin-btn" onClick={onClose}>ยกเลิก</button>
          <button className="admin-btn accent" onClick={handleSave}>{Ic.check} บันทึก</button>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════ */
/*  ADMIN PANEL CONTENT                                           */
/* ══════════════════════════════════════════════════════════════ */
function AdminPanel({ data, onDataChange, onClose }) {
  const [tab, setTab]       = useState("recipes"); // "recipes" | "ingredients"
  const [modal, setModal]   = useState(null);       // null | { type, item?, index? }
  const [toast, setToast]   = useState(null);

  const showToast = (msg, ok=true) => setToast({ msg, ok });

  /* ── Export JSON ── */
  const exportJSON = () => {
    // Rebuild to match gwm-cooking-data.json schema exactly
    const out = {
      ingredients: {},
      cooking_methods: {},
      recipes: data.recipes
    };
    Object.values(data.ingredients).forEach(ing => {
      out.ingredients[ing.id] = ing;
    });
    Object.values(data.methods).forEach(m => {
      out.cooking_methods[m.name] = { id: m.id, name: m.name, icon: m.icon };
    });
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement("a");
    a.href = url; a.download = "gwm-cooking-data.json"; a.click();
    URL.revokeObjectURL(url);
    showToast("Export สำเร็จ — นำไฟล์ไปวางใน /uploads/ แล้ว deploy");
  };

  /* ── Recipe CRUD ── */
  const saveRecipe = (formData) => {
    const recipes = [...data.recipes];
    if (modal.index != null) {
      recipes[modal.index] = { ...recipes[modal.index], ...formData };
    } else {
      const maxId = recipes.reduce((m,r) => Math.max(m, r.id), 0);
      recipes.push({ id: maxId + 1, ...formData });
    }
    onDataChange({ ...data, recipes });
    setModal(null);
    showToast(modal.index != null ? "แก้ไขสูตรแล้ว" : "เพิ่มสูตรแล้ว");
  };

  const deleteRecipe = (idx) => {
    if (!confirm("ลบสูตรอาหารนี้?")) return;
    const recipes = data.recipes.filter((_,i) => i !== idx);
    onDataChange({ ...data, recipes });
    showToast("ลบสูตรแล้ว", false);
  };

  /* ── Ingredient CRUD ── */
  const saveIng = (formData) => {
    const ings = { ...data.ingredients };
    if (modal.ingId != null) {
      ings[modal.ingId] = { ...ings[modal.ingId], ...formData };
    } else {
      const maxId = Math.max(0, ...Object.keys(ings).map(Number));
      const newId = maxId + 1;
      ings[newId] = { id: newId, ...formData };
    }
    onDataChange({ ...data, ingredients: ings });
    setModal(null);
    showToast(modal.ingId != null ? "แก้ไขวัตถุดิบแล้ว" : "เพิ่มวัตถุดิบแล้ว");
  };

  const deleteIng = (id) => {
    const used = data.recipes.some(r => r.ingredients.some(i => i.id === Number(id)));
    if (used) { alert("วัตถุดิบนี้ถูกใช้ในสูตรอาหาร ไม่สามารถลบได้"); return; }
    if (!confirm("ลบวัตถุดิบนี้?")) return;
    const ings = { ...data.ingredients };
    delete ings[id];
    onDataChange({ ...data, ingredients: ings });
    showToast("ลบวัตถุดิบแล้ว", false);
  };

  return (
    <div style={{ padding: "16px 0" }}>
      {/* Header */}
      <div className="admin-bar" style={{marginBottom:16}}>
        <span style={{fontSize:11, color:"oklch(0.78 0.10 75)", fontFamily:"var(--mono)", letterSpacing:"0.18em", textTransform:"uppercase", fontWeight:600}}>
          🛡 Admin Panel
        </span>
        <span style={{flex:1}} />
        <button className="admin-btn accent" onClick={exportJSON}>
          {Ic.download} Export JSON
        </button>
        <button className="admin-btn" onClick={onClose}>
          {Ic.x} ปิด
        </button>
      </div>

      {/* Tabs */}
      <div className="admin-tabs">
        <button className={`admin-tab${tab==="recipes"?" on":""}`} onClick={()=>setTab("recipes")}>
          สูตรอาหาร ({data.recipes.length})
        </button>
        <button className={`admin-tab${tab==="ingredients"?" on":""}`} onClick={()=>setTab("ingredients")}>
          วัตถุดิบ ({Object.keys(data.ingredients).length})
        </button>
      </div>

      {/* Recipes table */}
      {tab === "recipes" && (
        <>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>
            <button className="admin-btn accent" onClick={()=>setModal({type:"recipe"})}>
              {Ic.plus} เพิ่มสูตร
            </button>
          </div>
          <div className="admin-table">
            <div className="admin-table-head">
              <span className="admin-table-head-label" style={{flex:1}}>ชื่อสูตร</span>
              <span className="admin-table-head-label" style={{width:70}}>Lv.</span>
              <span className="admin-table-head-label" style={{width:70}}>วิธี</span>
              <span className="admin-table-head-label" style={{width:56}}>จัดการ</span>
            </div>
            {data.recipes.map((r, idx) => (
              <div className="admin-row" key={r.id}>
                <span className="admin-row-name">{r.name}</span>
                <span className="admin-row-meta" style={{width:70}}>Lv.{r.station_level}+</span>
                <span className="admin-row-meta" style={{width:70}}>{r.method}</span>
                <div className="admin-row-acts">
                  <button className="tbl-btn" title="แก้ไข" onClick={()=>setModal({type:"recipe", item:r, index:idx})}>
                    {Ic.edit}
                  </button>
                  <button className="tbl-btn danger" title="ลบ" onClick={()=>deleteRecipe(idx)}>
                    {Ic.trash}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* Ingredients table */}
      {tab === "ingredients" && (
        <>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:8}}>
            <button className="admin-btn accent" onClick={()=>setModal({type:"ingredient"})}>
              {Ic.plus} เพิ่มวัตถุดิบ
            </button>
          </div>
          <div className="admin-table">
            <div className="admin-table-head">
              <span className="admin-table-head-label" style={{width:40}}>ID</span>
              <span className="admin-table-head-label" style={{flex:1}}>ชื่อ</span>
              <span className="admin-table-head-label" style={{width:80}}>หมวด</span>
              <span className="admin-table-head-label" style={{width:60}}>ราคา</span>
              <span className="admin-table-head-label" style={{width:56}}>จัดการ</span>
            </div>
            {Object.entries(data.ingredients).map(([id, ing]) => (
              <div className="admin-row" key={id}>
                <span className="admin-row-meta" style={{width:40,fontFamily:"var(--mono)"}}>{id}</span>
                <span className="admin-row-name">{ing.name}</span>
                <span className="admin-row-meta" style={{width:80}}>{ing.category}</span>
                <span className="admin-row-meta" style={{width:60}}>{ing.price > 0 ? `${ing.price}` : "—"}</span>
                <div className="admin-row-acts">
                  <button className="tbl-btn" title="แก้ไข" onClick={()=>setModal({type:"ingredient", item:ing, ingId:Number(id)})}>
                    {Ic.edit}
                  </button>
                  <button className="tbl-btn danger" title="ลบ" onClick={()=>deleteIng(id)}>
                    {Ic.trash}
                  </button>
                </div>
              </div>
            ))}
          </div>
        </>
      )}

      {/* Modals */}
      {modal?.type === "recipe" && (
        <RecipeModal
          initial={modal.item}
          ingredients={data.ingredients}
          methods={data.methods}
          onSave={saveRecipe}
          onClose={()=>setModal(null)}
        />
      )}
      {modal?.type === "ingredient" && (
        <IngModal
          initial={modal.item}
          onSave={saveIng}
          onClose={()=>setModal(null)}
        />
      )}

      {toast && <Toast msg={toast.msg} ok={toast.ok} onDone={()=>setToast(null)} />}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════ */
/*  ING ICON — รูปวัตถุดิบ (fallback เป็น dot สี)               */
/* ══════════════════════════════════════════════════════════════ */
function IngIcon({ id, catClass, catColor }) {
  const [err, setErr] = useState(false);
  const src = `/uploads/icons/ing_${id}.png`;
  if (err) {
    return (
      <div className={`ing-dot-fallback ${catClass}`} style={{
        width: 32, height: 32, borderRadius: 6,
        background: `${catColor}22`,
        border: `1px solid ${catColor}55`,
        display: "grid", placeItems: "center"
      }}>
        <div className="ing-dot" style={{width:8,height:8,borderRadius:2,background:catColor}} />
      </div>
    );
  }
  return (
    <img
      src={src}
      alt=""
      onError={() => setErr(true)}
      style={{
        width: 40, height: 40, objectFit: "contain",
        borderRadius: 6,
        background: "oklch(0.20 0.006 250)",
        border: "1px solid oklch(0.30 0.008 250 / 0.6)"
      }}
    />
  );
}

/* ══════════════════════════════════════════════════════════════ */
/*  MAIN APP                                                       */
/* ══════════════════════════════════════════════════════════════ */
function App() {
  /* ── State ── */
  const [rawData, setRawData]     = useState(null);   // loaded from JSON
  const [data, setData]           = useState(null);   // working copy (admin edits)
  const [loading, setLoading]     = useState(true);
  const [error, setError]         = useState(null);
  const [session, setSession]     = useState(null);   // null = unknown, false = not logged in
  const [adminOpen, setAdminOpen] = useState(false);
  const [activeId, setActiveId]   = useState(null);
  const [query, setQuery]         = useState("");
  const [seg, setSeg]             = useState("all");  // "all" | "1" | "6" | "11"
  const [methodFilter, setMethodFilter] = useState(null);
  const [basket, setBasket]       = useState({});
  const [bkOpen, setBkOpen]       = useState(false);
  const [toast, setToast]         = useState(null);

  /* ── Load data from JSON ── */
  useEffect(() => {
    fetch("/uploads/gwm-cooking-data.json")
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(json => {
        // Normalise: cooking_methods → methods map, ingredients id fix
        const methods = {};
        Object.entries(json.cooking_methods || {}).forEach(([k, v]) => {
          methods[k] = v;
        });
        const ingredients = {};
        Object.entries(json.ingredients || {}).forEach(([id, v]) => {
          ingredients[Number(id)] = v;
        });
        const d = { ingredients, methods, recipes: json.recipes || [] };
        setRawData(d);
        setData(d);
        setLoading(false);
      })
      .catch(err => {
        setError(err.message);
        setLoading(false);
      });
  }, []);

  /* ── Check session (non-blocking) ── */
  useEffect(() => {
    fetch("/api/state", { credentials: "include" })
      .then(r => r.ok ? r.json() : null)
      .then(json => {
        if (json?.session) setSession(json.session);
        else setSession(false);
      })
      .catch(() => setSession(false));
  }, []);

  const isAdmin = session && (session.role === "admin" || session.role === "sub_admin");

  /* ── Helpers ── */
  const methodColor = m => METHOD_CFG[m]?.color ?? "var(--fg-2)";
  const methodIcon  = m => METHOD_CFG[m]?.icon  ?? null;
  const catColor    = cat => {
    const e = Object.entries(CAT_MAP).find(([k]) => k === cat);
    return e ? e[1].color : "var(--fg-3)";
  };
  const catKey = cat => {
    const e = Object.entries(CAT_MAP).find(([k]) => k === cat);
    return e ? e[1].key : "spice";
  };

  /* ── Filtered recipes ── */
  const filtered = !data ? [] : data.recipes.filter(r => {
    const q = query.toLowerCase();
    if (q && !r.name.toLowerCase().includes(q)) return false;
    if (seg !== "all" && String(r.station_level) !== seg) return false;
    if (methodFilter && r.method !== methodFilter) return false;
    return true;
  });

  /* ── Group by tier ── */
  const groups = [1, 6, 11].map(t => ({
    tier: t,
    label: `Lv.${t}+`,
    items: filtered.filter(r => r.station_level === t),
  })).filter(g => g.items.length > 0);

  /* ── Active recipe ── */
  const active = data?.recipes.find(r => r.id === activeId) ?? null;

  /* ── Ingredient cost helpers ── */
  const ingObj = id => data?.ingredients[id] ?? null;

  const recipeCostPerBatch = r => {
    return r.ingredients.reduce((sum, i) => {
      const ing = ingObj(i.id);
      return sum + (ing?.price ?? 0) * i.qty;
    }, 0);
  };

  /* ── Basket helpers ── */
  const addToBasket  = (id, n=1) => setBasket(b => ({ ...b, [id]: Math.max(1, (b[id]||0) + n) }));
  const setInBasket  = (id, v)   => { const n=Math.max(0,Number(v)); n===0 ? rmFromBasket(id) : setBasket(b=>({...b,[id]:n})); };
  const rmFromBasket = id        => setBasket(b => { const c={...b}; delete c[id]; return c; });
  const clearBasket  = ()        => setBasket({});

  const basketItems = Object.entries(basket).map(([id, qty]) => {
    const r = data?.recipes.find(r => r.id === Number(id));
    return r ? { recipe: r, qty } : null;
  }).filter(Boolean);

  const totalIngs = basketItems.reduce((acc, { recipe: r, qty }) => {
    r.ingredients.forEach(i => { acc[i.id] = (acc[i.id] || 0) + i.qty * qty * r.batch; });
    return acc;
  }, {});

  const totalCost = Object.entries(totalIngs).reduce((sum, [id, qty]) => {
    return sum + (ingObj(Number(id))?.price ?? 0) * qty;
  }, 0);

  /* ── Loading / error screens ── */
  if (loading) return (
    <div className="state-screen">
      {Ic.chef}
      <p>กำลังโหลดสูตรอาหาร…</p>
    </div>
  );

  if (error) return (
    <div className="state-screen">
      {Ic.x}
      <p style={{color:"var(--err)"}}>โหลดข้อมูลไม่สำเร็จ ({error})</p>
      <p style={{fontSize:11,fontFamily:"var(--mono)",color:"var(--fg-3)"}}>ตรวจสอบไฟล์ /uploads/gwm-cooking-data.json</p>
    </div>
  );

  return (
    <div className="app-v2">
      {/* ── Header ── */}
      <div className="head">
        <a href="/app" className="back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" style={{width:12,height:12}}><path d="m15 18-6-6 6-6"/></svg>
          กลับ
        </a>
        <div className="h-title">
          <h1><span className="glyph">{Ic.chef}</span>สูตรอาหาร</h1>
          <span className="sub">{data.recipes.length} สูตร · {Object.keys(data.ingredients).length} วัตถุดิบ
            {isAdmin && <span style={{marginLeft:8, color:"oklch(0.78 0.10 75)"}}>· Admin Mode</span>}
          </span>
        </div>

        {/* Admin toggle button */}
        {isAdmin && (
          <button
            className={`admin-btn${adminOpen ? " accent" : ""}`}
            onClick={() => setAdminOpen(o => !o)}
            style={{flexShrink:0}}
          >
            {Ic.shield} {adminOpen ? "ปิด Admin" : "Admin Panel"}
          </button>
        )}
      </div>

      {/* ── Admin Panel (inline) ── */}
      {adminOpen && isAdmin && (
        <AdminPanel
          data={data}
          onDataChange={setData}
          onClose={() => setAdminOpen(false)}
        />
      )}

      {/* ── Main layout ── */}
      <div className="layout">
        {/* Rail */}
        <div className="rail">
          <div className="rail-filters">
            {/* Search */}
            <div className="search">
              <span className="ic">{Ic.search}</span>
              <input
                placeholder="ค้นหาสูตร…"
                value={query}
                onChange={e => setQuery(e.target.value)}
              />
            </div>
            {/* Tier seg */}
            <div className="seg">
              {[["all","ทั้งหมด"],["1","Lv.1"],["6","Lv.6"],["11","Lv.11"]].map(([v,l]) => (
                <button key={v} className={seg===v?"on":""} onClick={()=>setSeg(v)}>{l}</button>
              ))}
            </div>
            {/* Method chips */}
            <div className="rail-methods">
              {Object.entries(METHOD_CFG).map(([name, cfg]) => (
                <button
                  key={name}
                  title={name}
                  className={`m-chip mini${methodFilter===name?" on":""}`}
                  style={{"--m-color": cfg.color}}
                  onClick={() => setMethodFilter(f => f===name ? null : name)}
                >
                  {cfg.icon}
                </button>
              ))}
            </div>
          </div>

          <div className="rail-count">
            แสดง <b>{filtered.length}</b> จาก {data.recipes.length} สูตร
          </div>

          <div className="rail-list">
            {groups.length === 0 && <div className="empty">ไม่พบสูตรที่ค้นหา</div>}
            {groups.map(g => (
              <div className="rail-group" key={g.tier}>
                <div className="rail-group-head">
                  <span className={`tier-pill t-${g.tier}`}>{g.label}</span>
                  <span className="rail-group-count">{g.items.length}</span>
                </div>
                {g.items.map((r, i) => {
                  const cost = recipeCostPerBatch(r);
                  const mc = methodColor(r.method);
                  return (
                    <button
                      key={r.id}
                      className={`lr-row${activeId===r.id?" is-active":""}`}
                      style={{"--m-color": mc}}
                      onClick={() => setActiveId(r.id)}
                    >
                      <span className="lr-num">{String(i+1).padStart(2,"0")}</span>
                      <span className="lr-body">
                        <span className="lr-name">{r.name}</span>
                        <span className="lr-meta">
                          <span className="lr-method">
                            <span style={{width:9,height:9,display:"inline-block",color:mc}}>{methodIcon(r.method)}</span>
                            {r.method}
                          </span>
                          {r.batch > 1 && <span className="lr-batch">×{r.batch}</span>}
                        </span>
                      </span>
                      <span className="lr-tail">
                        {cost > 0 && <span className="lr-qty">{cost}</span>}
                        <span className="lr-chev">{Ic.chevR}</span>
                      </span>
                    </button>
                  );
                })}
              </div>
            ))}
          </div>
        </div>

        {/* Detail pane */}
        <div className="pane">
          {!active ? (
            <div className="detail empty-detail">
              <div className="ed-mark">{Ic.chef}</div>
              <div className="ed-title">เลือกสูตรอาหาร</div>
              <div className="ed-sub">คลิกสูตรด้านซ้ายเพื่อดูรายละเอียด</div>
            </div>
          ) : (
            <DetailPane
              recipe={active}
              ingredients={data.ingredients}
              methods={data.methods}
              allRecipes={data.recipes}
              basket={basket}
              onAddBasket={addToBasket}
              onSetBasket={setInBasket}
              onSelectRecipe={setActiveId}
              methodColor={methodColor}
              methodIcon={methodIcon}
              catColor={catColor}
              catKey={catKey}
              ingObj={ingObj}
              recipeCostPerBatch={recipeCostPerBatch}
            />
          )}
        </div>
      </div>

      {/* ── Basket bar ── */}
      <BasketBar
        items={basketItems}
        totalIngs={totalIngs}
        totalCost={totalCost}
        isOpen={bkOpen}
        onToggle={() => setBkOpen(o=>!o)}
        onSet={setInBasket}
        onClear={clearBasket}
        onSelect={setActiveId}
        ingObj={ingObj}
        catKey={catKey}
        catColor={catColor}
      />

      {toast && <Toast msg={toast.msg} ok={toast.ok} onDone={()=>setToast(null)} />}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════ */
/*  DETAIL PANE                                                    */
/* ══════════════════════════════════════════════════════════════ */
function DetailPane({ recipe: r, ingredients, methods, allRecipes, basket, onAddBasket, onSetBasket, onSelectRecipe, methodColor, methodIcon, catColor, catKey, ingObj, recipeCostPerBatch }) {
  const [qty, setQty] = useState(1);
  const tier = tierLabel(r.station_level);
  const mc = methodColor(r.method);
  const cost = recipeCostPerBatch(r);
  const totalCost = cost * qty;

  const ingCount = r.ingredients.reduce((s, i) => s + i.qty, 0);

  const related = allRecipes.filter(x => x.id !== r.id && x.method === r.method).slice(0, 6);

  return (
    <div className="detail">
      {/* Head */}
      <div className="dt-head">
        <div className="dt-head-left">
          <span className="dt-id">RECIPE · #{String(r.id).padStart(3,"0")}</span>
          <h2 className="dt-title">{r.name}</h2>
          <div className="dt-meta">
            <span className="method-pill" style={{"--m-color": mc}}>
              <span className="m-glyph">{methodIcon(r.method)}</span>
              {r.method}
            </span>
            <span className={`tier-pill ${tier.cls}`}>{tier.label}</span>
            {r.batch > 1 && <span className="dt-batch-badge">×{r.batch} ต่อครั้ง</span>}
          </div>
        </div>
        <div className="dt-actions">
          <div className="dt-add">
            <span className="dt-add-lbl">จำนวนครั้ง</span>
            <div className="bk-qty big">
              <button onClick={()=>setQty(q=>Math.max(1,q-1))} disabled={qty<=1}>{Ic.minus}</button>
              <input type="number" value={qty} min={1}
                onChange={e=>setQty(Math.max(1,Number(e.target.value)||1))}
              />
              <button onClick={()=>setQty(q=>q+1)}>{Ic.plus}</button>
            </div>
            <button className="admin-btn accent" style={{marginTop:4}} onClick={()=>onAddBasket(r.id, qty)}>
              {Ic.basket} ใส่ตะกร้า
            </button>
          </div>
        </div>
      </div>

      {/* Stats */}
      <div className="dt-stats">
        <div className="dt-stat">
          <span className="dt-stat-lbl">วัตถุดิบ</span>
          <span className="dt-stat-val">{r.ingredients.length}<span className="unit">ชนิด</span></span>
          <span className="dt-stat-sub">{ingCount} ชิ้นรวม</span>
        </div>
        <div className="dt-stat">
          <span className="dt-stat-lbl">ต้นทุน/ครั้ง</span>
          <span className="dt-stat-val">{cost > 0 ? cost : "—"}</span>
          <span className="dt-stat-sub">{r.batch > 1 ? `×${r.batch} output` : "1 output"}</span>
        </div>
        <div className="dt-stat">
          <span className="dt-stat-lbl">ต้นทุนรวม ({qty}ครั้ง)</span>
          <span className="dt-stat-val" style={{color:"var(--accent)"}}>{totalCost > 0 ? totalCost : "—"}</span>
          <span className="dt-stat-sub">{qty * r.batch} output</span>
        </div>
        <div className="dt-stat">
          <span className="dt-stat-lbl">วิธีทำ</span>
          <span className="dt-stat-val" style={{fontSize:13,color:mc,alignItems:"center",gap:6}}>
            <span style={{width:18,height:18,display:"inline-flex"}}>{methodIcon(r.method)}</span>
            {r.method}
          </span>
          <span className="dt-stat-sub">Lv.{r.station_level}+ ขึ้นไป</span>
        </div>
      </div>

      {/* Ingredients */}
      <div className="dt-section">
        <div className="dt-section-head">
          <span className="dt-section-title">วัตถุดิบ</span>
          <span className="dt-section-sub">×{qty} ครั้ง</span>
        </div>
        <div className="dt-ing-table">
          {r.ingredients.map((i, idx) => {
            const ing = ingObj(i.id);
            if (!ing) return null;
            const ck  = catKey(ing.category);
            const cc  = catColor(ing.category);
            const totalQ = i.qty * qty;
            const totalC = (ing.price ?? 0) * totalQ;
            return (
              <div className={`dt-ing-row cat-${ck}`} key={idx}>
                <div className="dt-ing-dot">
                  <IngIcon id={i.id} catClass={`cat-${ck}`} catColor={cc} />
                </div>
                <div className="dt-ing-name">
                  <span className="n">{ing.name}</span>
                  <span className="c">{ing.category}</span>
                </div>
                <div className="dt-ing-qty">
                  <b>{totalQ}</b><span>ชิ้น</span>
                </div>
                <div className="dt-ing-src">
                  {(ing.source ?? []).map((s,si) => (
                    <span key={si} className={s.includes("ร้านค้า")?"src-shop":"src-gather"}>{s}{si<(ing.source.length-1)?", ":""}</span>
                  ))}
                </div>
                <div className="dt-ing-cost">{totalC > 0 ? totalC : "—"}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* Cost strip */}
      {cost > 0 && (
        <div className="dt-cost-strip">
          <div className="dt-cost-cell">
            <span className="lbl">ต้นทุน/ครั้ง</span>
            <span className="val">{cost}</span>
            <span className="sub">per 1 craft</span>
          </div>
          <div className="dt-cost-cell">
            <span className="lbl">จำนวนครั้ง</span>
            <span className="val">×{qty}</span>
            <span className="sub">selected</span>
          </div>
          <div className="dt-cost-cell accent">
            <span className="lbl">รวมทั้งหมด</span>
            <span className="val">{totalCost}</span>
            <span className="sub">= {qty * r.batch} output</span>
          </div>
        </div>
      )}

      {/* Related */}
      {related.length > 0 && (
        <div className="dt-section">
          <div className="dt-section-head">
            <span className="dt-section-title">สูตรวิธีเดียวกัน</span>
          </div>
          <div className="dt-related">
            {related.map(x => {
              const xmc = methodColor(x.method);
              const xt  = tierLabel(x.station_level);
              return (
                <button key={x.id} className="rel-card" style={{"--m-color": xmc}} onClick={()=>onSelectRecipe(x.id)}>
                  <span className="rel-num">#{x.id}</span>
                  <span className="rel-name">{x.name}</span>
                  <span className="rel-meta">
                    <span className={`tier-pill ${xt.cls}`}>{xt.label}</span>
                  </span>
                </button>
              );
            })}
          </div>
        </div>
      )}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════ */
/*  BASKET BAR                                                     */
/* ══════════════════════════════════════════════════════════════ */
function BasketBar({ items, totalIngs, totalCost, isOpen, onToggle, onSet, onClear, onSelect, ingObj, catKey, catColor }) {
  if (items.length === 0) return null;

  const ingList = Object.entries(totalIngs).map(([id, qty]) => {
    const ing = ingObj(Number(id));
    return ing ? { ing, qty, cost: (ing.price ?? 0) * qty } : null;
  }).filter(Boolean).sort((a,b) => b.cost - a.cost);

  return (
    <div className={`bkbar${isOpen?" is-open":""}`}>
      <button className="bkbar-handle" onClick={onToggle}>
        <span className="bkbar-icon">{Ic.chevD}</span>
        <span className="bkbar-label">ตะกร้า</span>
        <span className="bkbar-pill">{items.length}</span>
        <span className="bkbar-spacer" />
        {totalCost > 0 && <span className="bkbar-stat"><b>{totalCost}</b>รวม</span>}
        <span className="bkbar-toggle">{isOpen ? "ซ่อน" : "แสดง"}</span>
      </button>

      {isOpen && (
        <div className="bkbar-body">
          <div className="bkbar-grid">
            {/* Recipes col */}
            <div className="bkbar-col">
              <div className="bkbar-col-head">
                <span className="bkbar-col-title">สูตร</span>
                <button className="bkbar-clear" onClick={onClear}>ล้าง</button>
              </div>
              <div className="bkbar-recipes">
                {items.map(({ recipe: r, qty }) => (
                  <div className="bkbar-recipe" key={r.id}>
                    <button className="bkbar-recipe-name" onClick={()=>onSelect(r.id)}>
                      <span className="lvl">Lv.{r.station_level}</span>
                      {r.name}
                    </button>
                    <div className="bk-qty">
                      <button onClick={()=>onSet(r.id, qty-1)}>−</button>
                      <input type="number" value={qty} onChange={e=>onSet(r.id, e.target.value)} />
                      <button onClick={()=>onSet(r.id, qty+1)}>+</button>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Ingredients col */}
            <div className="bkbar-col">
              <div className="bkbar-col-head">
                <span className="bkbar-col-title">วัตถุดิบรวม</span>
                <span className="bkbar-col-sub">{ingList.length} ชนิด</span>
              </div>
              <div className="bkbar-totals">
                {ingList.map(({ ing, qty, cost }) => (
                  <div className="bk-tot-row" key={ing.id}>
                    <span className="name">
                      <span className={`ing-dot cat-${catKey(ing.category)}`} style={{background: catColor(ing.category)}} />
                      <span>{ing.name}</span>
                    </span>
                    <span className="qty">{qty}</span>
                    <span className="sub">{cost > 0 ? cost : "—"}</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Summary col */}
            <div className="bkbar-col">
              <div className="bkbar-col-head">
                <span className="bkbar-col-title">สรุป</span>
              </div>
              <div className="bkbar-totals">
                <div className="bk-tot-row">
                  <span className="name"><span>สูตรทั้งหมด</span></span>
                  <span className="qty">{items.length}</span>
                  <span className="sub">สูตร</span>
                </div>
                <div className="bk-tot-row">
                  <span className="name"><span>วัตถุดิบรวม</span></span>
                  <span className="qty">{Object.values(totalIngs).reduce((a,b)=>a+b,0)}</span>
                  <span className="sub">ชิ้น</span>
                </div>
                {totalCost > 0 && (
                  <div className="bk-tot-row">
                    <span className="name"><span>ต้นทุนรวม</span></span>
                    <span className="qty" style={{color:"var(--accent)"}}>{totalCost}</span>
                    <span className="sub">ทอง</span>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ── Mount ── */
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
