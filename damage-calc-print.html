<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>Damage Calculator · Sword of Justice · Print</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="calc/styles.css">

<style>
  /* ── Print-friendly overrides ─────────────────────────────────── */
  html, body {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* On-screen preview: render at print width so what you see ≈ PDF */
  @media screen {
    body {
      background: oklch(0.10 0.012 30);
      padding: 20px;
    }
    .app {
      max-width: 1040px;
      margin: 0 auto;
      background:
        radial-gradient(circle at 80% -20%, oklch(0.20 0.06 25 / 0.6), transparent 50%),
        radial-gradient(circle at 0% 110%, oklch(0.18 0.04 60 / 0.4), transparent 50%),
        oklch(0.13 0.014 30);
      padding: 24px 28px 32px;
      border-radius: 14px;
      border: 1px solid oklch(0.34 0.020 30 / 0.55);
    }
  }

  /* Hide OCR upload button — interactive only */
  .ocr { display: none !important; }

  /* Remove input chrome so it reads as a printed value */
  .stat-input {
    cursor: default;
  }
  .stat-input input {
    pointer-events: none;
  }

  @page {
    size: A4 portrait;
    margin: 10mm;
  }

  @media print {
    html, body {
      background: oklch(0.13 0.014 30) !important;
      color: oklch(0.96 0.012 75);
    }
    body {
      padding: 0;
      margin: 0;
    }
    .app {
      max-width: none;
      padding: 0 4mm;
      margin: 0;
    }
    /* compress vertical rhythm for print */
    .masthead { margin-bottom: 8mm; padding: 12px 18px; break-inside: avoid; }
    .cols { gap: 8mm; margin-bottom: 8mm; break-inside: avoid; }
    .section { margin-bottom: 8mm; break-inside: avoid; }
    .panel { padding: 10px 14px 12px; break-inside: avoid; }
    .ideal-card, .rcard, .crit-cell, .prio-row {
      break-inside: avoid;
    }
    .bd-wrap { break-inside: avoid; }
    /* Slightly larger text for readability on paper */
    body { font-size: 12px; }
    .mh-title { font-size: 18px; }
    .rc-val { font-size: 22px; }
    .stat-input input { font-size: 15px; }

    /* Sections that should start on a new page if needed */
    .section-fill { break-inside: avoid; }

    /* Force the priority-list bars to render colors */
    .prio-bar-fill, .cc-bar span, .bd-seg {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
  }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="calc/logic.js"></script>
<script type="text/babel" src="calc/app.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<DmgApp />);

  // Auto-print once fonts + React have settled
  (async () => {
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
    } catch (e) {}
    // wait a bit more for React commit + image/layout settle
    await new Promise(r => setTimeout(r, 700));
    window.print();
  })();
</script>
</body>
</html>
