<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Guild War Manager</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GWM">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0a0805;font-family:'Segoe UI',system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#110d07;border:1px solid #3a2e1a;border-radius:16px;padding:40px 36px;width:360px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.logo{font-size:48px;margin-bottom:12px}
h1{font-size:22px;font-weight:700;color:#f0e6c8;letter-spacing:2px;margin-bottom:6px}
.sub{font-size:13px;color:#b8a070;margin-bottom:32px}
.btn-discord{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px 20px;background:#5865F2;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .2s;letter-spacing:.5px}
.btn-discord:hover{background:#4752C4;transform:translateY(-1px);box-shadow:0 8px 20px rgba(88,101,242,.4)}
.btn-discord svg{width:24px;height:24px;flex-shrink:0}
.note{font-size:11px;color:#6b5535;margin-top:20px;line-height:1.6}
.divider{height:1px;background:#3a2e1a;margin:24px 0}
.guild-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,168,75,.1);border:1px solid rgba(200,168,75,.3);border-radius:8px;padding:6px 14px;font-size:12px;color:#c8a84b}
</style>
</head>
<body>
<div class="card">
  <div class="logo">⚔️</div>
  <h1>GUILD WAR</h1>
  <div class="sub">Manager — Online Edition</div>
  <div class="guild-badge">🛡 เฉพาะสมาชิกกิลด์เท่านั้น</div>
  <div class="divider"></div>
  <a class="btn-discord" href="/auth/login">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
    Login ด้วย Discord
  </a>
  <div class="note">เข้าใช้งานได้เฉพาะสมาชิก Discord Server ของกิลด์เท่านั้น<br>ข้อมูลจะถูกบันทึกบน Cloud ใช้ได้ทุกเครื่อง</div>
</div>
<script>
/* PWA: Register Service Worker */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
