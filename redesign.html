<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="redesign/data.js"></script>

<body>
<div id="root"></div>

<script type="text/babel">
function App() {
  return (
    <DesignCanvas projectTitle="War Board · Redesign Directions" subtitle="3 takes on the same data — drag artboards, focus any one fullscreen.">
      <DCSection
        id="war-board"
        title="War Board"
        subtitle="Three directions on the CRIMINAL guild — same 10 teams, different conversations."
      >
        <DCArtboard id="dirA" label="A · Refined Dark — same shape, sharper hierarchy" width={1440} height={1040}>
          <DirectionA />
        </DCArtboard>
        <DCArtboard id="dirB" label="B · Tactical HUD — fleet readout, scoreboard energy" width={1440} height={1140}>
          <DirectionB />
        </DCArtboard>
        <DCArtboard id="dirC" label="C · Battle Constellation — squad insignias + side detail" width={1440} height={1080}>
          <DirectionC />
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
